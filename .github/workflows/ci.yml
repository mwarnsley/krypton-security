name: Krypton CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: krypton-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Phase 1 verification
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configure pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Configure npm and pinned Rust toolchain
        run: |
          npm install --global npm@10.8.2
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt --no-self-update
          node --version
          npm --version
          rustc --version
          python3 --version
          command -v unzip
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Require zero npm vulnerabilities
        run: npm run security:audit
      - name: Lint and typecheck both projects
        run: |
          npm run lint
          npx tsc --noEmit
          npx tsc --noEmit --project src/dashboard/tsconfig.json
      - name: Verify repository and Rust formatting
        run: |
          npm run format:check
          cargo fmt --manifest-path src/core-native/Cargo.toml --check
      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src/core-native/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run Vitest
        run: npm test -- --run
      - name: Run Rust unit tests
        run: npm run rust:test
      - name: Run native socket simulation
        run: npm run test:sim
      - name: Run production MCP E2E harness
        run: npm run test:e2e
      - name: Verify dashboard design system
        run: npm run design-system:check
      - name: Build production dashboard
        run: npm run build
      - name: Build local MCP extension
        run: npm run build:mcpb
      - name: Verify bundle ZIP integrity
        run: unzip -t dist/krypton-protected-fs.mcpb
      - name: Retain the verified MCP bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krypton-mcpb
          path: dist/krypton-protected-fs.mcpb
          if-no-files-found: error
          retention-days: 7
